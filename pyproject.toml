[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "interdependence-marl"
version = "0.1.0"
description = "Ability-Diverse Collaboration in Multi-Agent Reinforcement Learning via Interdependence Theory"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Mark Colley" }
]
dependencies = [
    "numpy==2.5.5",
    "torch>=2.15.0,<2.16.0",
    "matplotlib>=3.11.0,<3.12.0",
]

[project.optional-dependencies]
paper = [
    "rliable>=1.2.0",
    "gymnasium>=1.4.0",
    "pettingzoo>=1.27.0",
    "seaborn>=0.13.2",
]
dev = [
    "ruff>=0.4.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
