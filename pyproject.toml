[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "interdependence-marl"
version = "0.1.0"
description = "Ability-Diverse Collaboration in Multi-Agent Reinforcement Learning via Interdependence Theory"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Mark Colley" }
]
dependencies = [
    "numpy>=1.26.0",
    "torch>=2.1.0",
    "matplotlib>=3.8.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
